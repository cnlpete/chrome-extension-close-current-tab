name: Validate extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          set -euo pipefail

          jq -e '
            .manifest_version == 3 and
            (.name | (type == "string" and length > 0)) and
            (.version | (type == "string" and test("^[0-9]+(\\.[0-9]+){0,3}$"))) and
            (.background.service_worker | (type == "string" and length > 0))
          ' manifest.json > /dev/null

          worker="$(jq -r '.background.service_worker' manifest.json)"
          test -f "$worker"

      - name: Check service worker JavaScript syntax
        run: |
          worker="$(jq -r '.background.service_worker' manifest.json)"
          node --check "$worker"
