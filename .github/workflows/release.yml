name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Chrome manifest versions must contain one to four numeric components.
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag '$TAG' does not contain a valid Chrome extension version."
            echo "Use a tag such as v1.0.0."
            exit 1
          fi

          mkdir -p dist/package

          # Set the packaged manifest version from the tag.
          jq --arg version "$VERSION" \
            '.version = $version' \
            manifest.json > dist/package/manifest.json

          cp service-worker.js README.md LICENSE dist/package/

          zip -j "dist/close-current-tab-${TAG}.zip" \
            dist/package/manifest.json \
            dist/package/service-worker.js \
            dist/package/README.md \
            dist/package/LICENSE

          tar -czf "$GITHUB_WORKSPACE/dist/close-current-tab-${TAG}.tar.gz" \
            -C dist/package \
            manifest.json service-worker.js README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Close Current Tab ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/close-current-tab-${{ github.ref_name }}.zip
            dist/close-current-tab-${{ github.ref_name }}.tar.gz
